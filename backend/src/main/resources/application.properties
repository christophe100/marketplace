# ===================================================================
# SHOPERA SPRING BOOT BACKEND CONFIGURATION
# ===================================================================

# Server Execution Configuration
server.port=8080
server.servlet.context-path=/api

# --- H2 IN-MEMORY ENGINE CONFIGURATION (DEFAULT FOR INSTANT TESTING) ---
spring.datasource.url=jdbc:h2:mem:shoperadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- HIBERNATE JPA ORM SPECIFIC PROPS ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- OPTIONAL PRODUCTION POSTGRESQL ENGINE CONFIGURATION ---
# Uncomment the block below during your deployment to actual database containers
# spring.datasource.url=jdbc:postgresql://localhost:5432/shoperadb
# spring.datasource.username=postgres
# spring.datasource.password=yoursecurepassword
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
